name = "archsem-lean"
version = "0.1.0"
defaultTargets = ["ArchsemLean", "ArchSemTinyArm"]

[[require]]
name = "sail_tiny_arm"
git = "https://github.com/Chris-F5/sail-tiny-arm"
rev = "archsem-lean"
subDir = "lean-snapshot/out"

[[lean_lib]]
# CR clang for thibaut: Am I supposed to have uppercase 'S' in Archsem?
name = "ArchsemLean"
globs = ["ArchsemLean.**"]

[[lean_lib]]
name = "ArchSemTinyArm"
globs = ["ArchSemTinyArm.**"]

[[lean_exe]]
name = "archsem-lean"
root = "Main"
