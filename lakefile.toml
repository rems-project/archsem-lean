name = "archsem-lean"
version = "0.1.0"
defaultTargets = ["ArchSem", "ArchSemTinyArm"]

[[require]]
name = "sail_tiny_arm"
git = "https://github.com/Chris-F5/sail-tiny-arm"
rev = "archsem-lean"
subDir = "lean-snapshot/out"

[[lean_lib]]
name = "ArchSem"
globs = ["ArchSem.**"]

[[lean_lib]]
name = "ArchSemTinyArm"
globs = ["ArchSemTinyArm.**"]

[[lean_exe]]
name = "archsem-lean"
root = "Main"
